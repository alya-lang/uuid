[package]
name = "uuid"
version = "0.1.0"
alya-version = "0.0.12"
entry = "src/lib.alya"
description = "RFC 4122 UUID v4, RFC 9562 UUID v7, ULID, and NanoID toolkit for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
